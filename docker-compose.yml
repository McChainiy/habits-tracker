name: habit-tracker

services:
  app:
    build:
      context: ./backend
      args:
        POSTGRES_BASE_IMAGE: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habit_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-habit_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habit_tracker}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://habit_tracker:habit_tracker@127.0.0.1:5432/habit_tracker}
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
