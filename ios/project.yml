name: HabitTracker
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - HabitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.habittracker.month
        PRODUCT_NAME: HabitTracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
